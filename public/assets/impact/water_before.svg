<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient: Murky dusty rural tone -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#422018"/>
      <stop offset="50%" stop-color="#6e3926"/>
      <stop offset="100%" stop-color="#8d4b32"/>
    </linearGradient>

    <!-- Ground Gradient: Red soil stained with iron runoff -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="40%" stop-color="#541c09"/>
      <stop offset="100%" stop-color="#2a0c04"/>
    </linearGradient>

    <!-- Muddy Water Stream Gradient -->
    <linearGradient id="ironWaterStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="35%" stop-color="#c2410c"/>
      <stop offset="70%" stop-color="#782408"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Bucket Rust Gradient -->
    <linearGradient id="bucketRust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Iron Sediment Pool -->
    <radialGradient id="sludgePool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#991b1b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky and Rural Backdrop -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Distant village silhouette & dry trees -->
  <path d="M 0 260 L 60 250 L 120 255 L 180 245 L 240 258 L 320 250 L 400 260 L 480 252 L 560 258 L 650 248 L 740 255 L 800 250 L 800 300 L 0 300 Z" fill="#381a12" opacity="0.6"/>
  <path d="M 680 250 Q 695 180 710 250 M 700 200 Q 730 170 710 250 M 690 220 Q 660 190 695 250" stroke="#26100a" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 120 255 Q 135 190 145 255 M 135 210 Q 160 185 140 255" stroke="#26100a" stroke-width="2.5" fill="none" opacity="0.4"/>

  <!-- Ground: Iron-rich contaminated red earth -->
  <rect y="270" width="800" height="180" fill="url(#groundGrad)"/>
  
  <!-- Red puddles of arsenic & iron leachate -->
  <ellipse cx="440" cy="385" rx="140" ry="32" fill="url(#sludgePool)"/>
  <ellipse cx="260" cy="405" rx="90" ry="20" fill="url(#sludgePool)"/>
  <ellipse cx="620" cy="360" rx="70" ry="16" fill="url(#sludgePool)"/>

  <!-- India Mark II Handpump Stand & Pedestal -->
  <!-- Concrete pedestal with red iron rust cracks -->
  <polygon points="300,310 520,310 550,345 270,345" fill="#3e3935"/>
  <polygon points="270,345 550,345 570,380 250,380" fill="#2d2825"/>
  <!-- Rust staining on concrete -->
  <path d="M 370 310 Q 380 340 375 380 Q 430 380 435 340 Q 430 310 370 310 Z" fill="#7c2d12" opacity="0.75"/>

  <!-- Handpump Body (Cast Iron with severe rust) -->
  <!-- Lower cylinder -->
  <rect x="385" y="160" width="40" height="150" fill="#44403c" rx="3"/>
  <rect x="388" y="160" width="12" height="150" fill="#78716c" opacity="0.3"/>
  <!-- Rust coating on pump body -->
  <path d="M 385 180 Q 410 200 425 185 L 425 240 Q 400 260 385 230 Z" fill="#9a3412" opacity="0.85"/>
  <path d="M 385 250 Q 405 270 425 260 L 425 310 L 385 310 Z" fill="#7c2d12" opacity="0.9"/>

  <!-- Pump Head & Cap -->
  <rect x="375" y="140" width="60" height="22" fill="#292524" rx="4"/>
  <circle cx="405" cy="135" r="14" fill="#44403c"/>
  <circle cx="405" cy="135" r="7" fill="#78716c"/>

  <!-- Pump Lever/Handle (Angled Down) -->
  <line x1="412" y1="135" x2="570" y2="195" stroke="#292524" stroke-width="12" stroke-linecap="round"/>
  <line x1="412" y1="135" x2="570" y2="195" stroke="#78350f" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <circle cx="575" cy="197" r="14" fill="#1c1917"/>

  <!-- Pump Spout -->
  <path d="M 385 200 L 330 205 L 330 225 L 385 220 Z" fill="#292524"/>
  <polygon points="330,205 310,212 310,230 330,225" fill="#1c1917"/>
  <!-- Rust on spout -->
  <path d="M 345 205 L 320 210 L 320 228 L 350 222 Z" fill="#b45309" opacity="0.8"/>

  <!-- Contaminated Muddy Red Water Pouring from Spout -->
  <path d="M 312 218 Q 300 270 295 330 L 315 330 Q 320 270 326 226 Z" fill="url(#ironWaterStream)" opacity="0.95"/>
  <!-- Water turbulence & bubbles -->
  <circle cx="304" cy="260" r="3" fill="#f97316" opacity="0.8"/>
  <circle cx="312" cy="290" r="2.5" fill="#fdba74" opacity="0.9"/>
  <circle cx="300" cy="315" r="3.5" fill="#ea580c" opacity="0.85"/>
  <path d="M 290 325 Q 280 310 275 328" stroke="#ea580c" stroke-width="2" fill="none"/>
  <path d="M 320 325 Q 335 315 330 330" stroke="#f97316" stroke-width="2" fill="none"/>

  <!-- Rusted Collection Bucket -->
  <ellipse cx="305" cy="330" rx="35" ry="9" fill="#1e293b"/>
  <!-- Murky Water Inside Bucket -->
  <ellipse cx="305" cy="331" rx="33" ry="8" fill="#7c2d12"/>
  <ellipse cx="305" cy="331" rx="26" ry="6" fill="#9a3412"/>
  <polygon points="270,330 340,330 332,385 278,385" fill="url(#bucketRust)"/>
  <ellipse cx="305" cy="385" rx="27" ry="6" fill="#451a03"/>
  <!-- Rust streaks on bucket -->
  <path d="M 285 330 Q 282 355 288 385 L 298 385 Q 292 355 296 330 Z" fill="#b45309" opacity="0.7"/>
  <path d="M 320 330 Q 325 355 318 385 L 328 385 Q 332 355 330 330 Z" fill="#78350f" opacity="0.8"/>

  <!-- Atmospheric Dust & Iron Particulates -->
  <g opacity="0.25">
    <circle cx="210" cy="180" r="1.5" fill="#f97316"/>
    <circle cx="250" cy="130" r="2" fill="#fb923c"/>
    <circle cx="350" cy="110" r="1.5" fill="#fdba74"/>
    <circle cx="480" cy="120" r="2" fill="#ea580c"/>
    <circle cx="520" cy="170" r="1.5" fill="#f97316"/>
    <circle cx="640" cy="210" r="2" fill="#c2410c"/>
  </g>

  <!-- Ground Reality Telemetry / Contaminant HUD Banner -->
  <g transform="translate(480, 40)">
    <rect width="280" height="92" rx="12" fill="#180a06" fill-opacity="0.88" stroke="#b91c1c" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="8" fill="#dc2626"/>
    <text x="22" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">!</text>
    <text x="38" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fca5a5" letter-spacing="0.5">UNSAFE DRINKING WATER</text>
    <text x="38" y="36" font-family="system-ui, sans-serif" font-size="9" fill="#f87171">Namkum Handpump Source #04</text>

    <!-- Stat 1: Iron -->
    <rect x="16" y="48" width="118" height="34" rx="6" fill="#2d120a" stroke="#7f1d1d" stroke-width="1"/>
    <text x="24" y="60" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#fdba74">DISSOLVED IRON (Fe)</text>
    <text x="24" y="75" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ef4444">4.8 mg/L</text>
    <text x="82" y="74" font-family="system-ui, sans-serif" font-size="7.5" fill="#fca5a5">(BIS: 0.3)</text>

    <!-- Stat 2: Turbidity -->
    <rect x="142" y="48" width="122" height="34" rx="6" fill="#2d120a" stroke="#7f1d1d" stroke-width="1"/>
    <text x="150" y="60" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#fdba74">TURBIDITY LEVEL</text>
    <text x="150" y="75" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ef4444">28 NTU</text>
    <text x="206" y="74" font-family="system-ui, sans-serif" font-size="7.5" fill="#fca5a5">(High Turbid)</text>
  </g>
</svg>
