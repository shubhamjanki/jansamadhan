<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Heavy Industrial Smog Sky Gradient -->
    <linearGradient id="smogSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="35%" stop-color="#27272a"/>
      <stop offset="70%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>

    <!-- Coal Haul Road (Unpaved, Soot-Laden) -->
    <linearGradient id="coalRoad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="40%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Thick Coal Soot Plume Radial Gradient -->
    <radialGradient id="coalDustCloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09090b" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#18181b" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#3f3f46" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#71717a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Heavy Smog Atmospheric Sky -->
  <rect width="800" height="450" fill="url(#smogSky)"/>

  <!-- Sun choked by dense particulate smog -->
  <circle cx="280" cy="110" r="38" fill="#a1a1aa" opacity="0.3"/>
  <circle cx="280" cy="110" r="25" fill="#f4f4f5" opacity="0.4"/>

  <!-- Distant Tisra Primary School Shrouded in Black Soot Fog -->
  <g transform="translate(480, 180)" opacity="0.35">
    <!-- School building outline -->
    <rect width="180" height="70" fill="#27272a"/>
    <polygon points="-10,0 90,-25 190,0" fill="#18181b"/>
    <!-- Flagpole -->
    <line x1="90" y1="-25" x2="90" y2="-55" stroke="#27272a" stroke-width="2"/>
    <!-- Windows covered in soot -->
    <rect x="20" y="20" width="22" height="22" fill="#09090b"/>
    <rect x="60" y="20" width="22" height="22" fill="#09090b"/>
    <rect x="100" y="20" width="22" height="22" fill="#09090b"/>
    <rect x="140" y="20" width="22" height="22" fill="#09090b"/>
  </g>

  <!-- Mining Transit Road Ground -->
  <rect y="250" width="800" height="200" fill="url(#coalRoad)"/>

  <!-- Massive Billowing Coal Dust Plumes from Road Traversal -->
  <ellipse cx="260" cy="270" rx="140" ry="70" fill="url(#coalDustCloud)"/>
  <ellipse cx="160" cy="230" rx="110" ry="65" fill="url(#coalDustCloud)"/>
  <ellipse cx="380" cy="260" rx="130" ry="60" fill="url(#coalDustCloud)"/>
  <ellipse cx="490" cy="280" rx="160" ry="65" fill="url(#coalDustCloud)"/>
  <ellipse cx="640" cy="290" rx="120" ry="50" fill="url(#coalDustCloud)"/>

  <!-- Massive 50-Ton Heavy Coal Haul Dumper Truck -->
  <g transform="translate(140, 160)">
    <!-- Coal Cargo Bed Loaded High with Black Bituminous Coal -->
    <polygon points="50,110 250,90 280,30 40,50" fill="#09090b" stroke="#18181b" stroke-width="2"/>
    <!-- Black Coal Mounds spilling over -->
    <path d="M 45 45 Q 80 15 120 28 Q 160 10 200 22 Q 240 12 275 32 Z" fill="#040405"/>
    <ellipse cx="120" cy="28" rx="35" ry="12" fill="#18181b"/>
    <ellipse cx="190" cy="24" rx="40" ry="14" fill="#18181b"/>

    <!-- Truck Cab & Driver Chassis -->
    <polygon points="260,90 320,90 330,130 330,150 260,150" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <rect x="270" y="98" width="45" height="32" rx="4" fill="#18181b"/> <!-- Soot-covered windshield -->
    <rect x="250" y="115" width="20" height="35" fill="#ca8a04"/>

    <!-- Heavy Dumper Huge Off-Road Tires -->
    <!-- Rear Tire Pair 1 -->
    <circle cx="85" cy="155" r="32" fill="#09090b" stroke="#27272a" stroke-width="6"/>
    <circle cx="85" cy="155" r="16" fill="#18181b"/>
    <!-- Rear Tire Pair 2 -->
    <circle cx="165" cy="155" r="32" fill="#09090b" stroke="#27272a" stroke-width="6"/>
    <circle cx="165" cy="155" r="16" fill="#18181b"/>
    <!-- Front Steering Tire -->
    <circle cx="295" cy="155" r="32" fill="#09090b" stroke="#27272a" stroke-width="6"/>
    <circle cx="295" cy="155" r="16" fill="#18181b"/>

    <!-- Exhaust Smoke Stack -->
    <rect x="252" y="45" width="8" height="60" fill="#27272a"/>
    <!-- Exhaust black puff -->
    <circle cx="256" cy="35" r="12" fill="#09090b" opacity="0.8"/>
    <circle cx="250" cy="20" r="18" fill="#18181b" opacity="0.6"/>
  </g>

  <!-- Ambient Floating Respirable Soot Particulates (PM2.5) -->
  <g opacity="0.6">
    <circle cx="340" cy="180" r="2.5" fill="#09090b"/>
    <circle cx="380" cy="140" r="2" fill="#18181b"/>
    <circle cx="450" cy="160" r="3" fill="#09090b"/>
    <circle cx="520" cy="120" r="2" fill="#18181b"/>
    <circle cx="600" cy="150" r="3" fill="#09090b"/>
    <circle cx="670" cy="180" r="2" fill="#18181b"/>
    <circle cx="720" cy="130" r="2.5" fill="#09090b"/>
  </g>

  <!-- Telemetry HUD Banner: Severe Air Quality Alert -->
  <g transform="translate(480, 40)">
    <rect width="280" height="92" rx="12" fill="#180a06" fill-opacity="0.92" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="8" fill="#dc2626"/>
    <text x="22" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">!</text>
    <text x="38" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fca5a5" letter-spacing="0.5">SEVERE COAL DUST SMOG</text>
    <text x="38" y="36" font-family="system-ui, sans-serif" font-size="9" fill="#f87171">Tisra Settlement &amp; School Corridor</text>

    <!-- Stat 1: PM2.5 -->
    <rect x="16" y="48" width="118" height="34" rx="6" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
    <text x="24" y="60" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#fdba74">AMBIENT PM2.5</text>
    <text x="24" y="75" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ef4444">382 µg/m³</text>
    <text x="96" y="74" font-family="system-ui, sans-serif" font-size="7.5" fill="#fca5a5">(6.3x Limit)</text>

    <!-- Stat 2: Risk -->
    <rect x="142" y="48" width="122" height="34" rx="6" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
    <text x="150" y="60" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#fdba74">RESPIRATORY RISK</text>
    <text x="150" y="75" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ef4444">CRITICAL</text>
    <text x="206" y="74" font-family="system-ui, sans-serif" font-size="7.5" fill="#fca5a5">(Choked)</text>
  </g>
</svg>
