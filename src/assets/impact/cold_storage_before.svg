<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Scorching Sun Sky Gradient -->
    <linearGradient id="heatSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="30%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Dry Earth Gradient -->
    <linearGradient id="dryField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#260e02"/>
    </linearGradient>

    <!-- Sun Burst Flare -->
    <radialGradient id="sunFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="30%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </radialGradient>

    <!-- Wilted Rotten Tomato Gradient -->
    <radialGradient id="rotTomato" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="85%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f0303"/>
    </radialGradient>
  </defs>

  <!-- Sky under harsh afternoon sun -->
  <rect width="800" height="450" fill="url(#heatSky)"/>

  <!-- Blazing Sun & Heat Wave Rays -->
  <circle cx="200" cy="90" r="140" fill="url(#sunFlare)"/>
  <circle cx="200" cy="90" r="35" fill="#fef08a"/>
  <!-- Heat shimmer lines -->
  <path d="M 50 180 Q 200 160 350 180 T 650 180 T 800 180" stroke="#fef08a" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 0 210 Q 150 190 300 210 T 600 210 T 800 210" stroke="#fef08a" stroke-width="1.5" fill="none" opacity="0.35"/>
  <path d="M 20 240 Q 180 220 340 240 T 700 240 T 800 240" stroke="#fef08a" stroke-width="1.2" fill="none" opacity="0.3"/>

  <!-- Dry Torpa Field Soil -->
  <rect y="270" width="800" height="180" fill="url(#dryField)"/>
  <line x1="0" y1="270" x2="800" y2="270" stroke="#b45309" stroke-width="2"/>

  <!-- Stacked Weathered Wooden Crates in Open Heat -->
  <!-- Back Crate (Shadowed) -->
  <g transform="translate(240, 210)">
    <rect width="170" height="85" rx="4" fill="#543825" stroke="#291a10" stroke-width="2"/>
    <line x1="0" y1="28" x2="170" y2="28" stroke="#291a10" stroke-width="2"/>
    <line x1="0" y1="56" x2="170" y2="56" stroke="#291a10" stroke-width="2"/>
    <!-- Spoiled Peas piling out -->
    <ellipse cx="60" cy="20" rx="40" ry="15" fill="#4d4c14"/>
    <circle cx="45" cy="18" r="7" fill="#3f3f0e"/>
    <circle cx="62" cy="15" r="8" fill="#4d4c14"/>
    <circle cx="78" cy="22" r="7" fill="#2d2f09"/>
  </g>

  <!-- Front Left Crate (Tomatoes) -->
  <g transform="translate(180, 260)">
    <rect width="190" height="110" rx="4" fill="#714b2d" stroke="#3d2412" stroke-width="2.5"/>
    <line x1="0" y1="36" x2="190" y2="36" stroke="#3d2412" stroke-width="2"/>
    <line x1="0" y1="72" x2="190" y2="72" stroke="#3d2412" stroke-width="2"/>
    <rect x="15" y="10" width="12" height="90" fill="#4d301b"/>
    <rect x="163" y="10" width="12" height="90" fill="#4d301b"/>

    <!-- Spoiled, squished, brown-spotted rotting tomatoes -->
    <ellipse cx="40" cy="15" rx="18" ry="14" fill="url(#rotTomato)"/>
    <ellipse cx="75" cy="12" rx="20" ry="15" fill="url(#rotTomato)"/>
    <ellipse cx="115" cy="16" rx="22" ry="16" fill="url(#rotTomato)"/>
    <ellipse cx="155" cy="20" rx="19" ry="14" fill="url(#rotTomato)"/>

    <ellipse cx="55" cy="28" rx="20" ry="14" fill="url(#rotTomato)"/>
    <ellipse cx="95" cy="25" rx="22" ry="15" fill="url(#rotTomato)"/>
    <ellipse cx="138" cy="30" rx="18" ry="13" fill="url(#rotTomato)"/>

    <!-- Wrinkles, cracks, rot liquid seepage -->
    <path d="M 75 8 Q 80 18 73 22" stroke="#220505" stroke-width="2" fill="none"/>
    <path d="M 112 10 Q 118 20 115 28" stroke="#1c0404" stroke-width="2" fill="none"/>
    <ellipse cx="95" cy="28" rx="6" ry="4" fill="#220505"/>
    <!-- Liquid leak dripping down wooden slat -->
    <path d="M 95 36 L 97 75 L 94 75 Z" fill="#450a0a"/>
    <ellipse cx="96" cy="76" rx="3" ry="4" fill="#7f1d1d"/>
  </g>

  <!-- Front Right Crate (Green Peas & Vegetables rotting under heat) -->
  <g transform="translate(390, 275)">
    <rect width="180" height="95" rx="4" fill="#603e24" stroke="#2e1b0c" stroke-width="2.5"/>
    <line x1="0" y1="32" x2="180" y2="32" stroke="#2e1b0c" stroke-width="2"/>
    <line x1="0" y1="64" x2="180" y2="64" stroke="#2e1b0c" stroke-width="2"/>

    <!-- Wilted brown-spotted pea pods -->
    <path d="M 25 15 Q 55 5 80 20 Q 55 25 25 15" fill="#4b5320"/>
    <path d="M 60 12 Q 95 0 125 15 Q 95 22 60 12" fill="#3f4216"/>
    <path d="M 100 18 Q 135 10 160 25 Q 135 30 100 18" fill="#584b1b"/>
    <ellipse cx="85" cy="14" rx="4" ry="3" fill="#2d2208"/>
    <ellipse cx="130" cy="18" rx="4" ry="3" fill="#2d2208"/>
  </g>

  <!-- Fallen Rotten Tomatoes on Soil with Flies -->
  <ellipse cx="140" cy="385" rx="16" ry="10" fill="url(#rotTomato)"/>
  <ellipse cx="150" cy="388" rx="14" ry="7" fill="#450a0a" opacity="0.6"/>
  <!-- Fly dots -->
  <circle cx="136" cy="368" r="1.5" fill="#000000"/>
  <circle cx="148" cy="362" r="1.5" fill="#000000"/>
  <circle cx="160" cy="372" r="1.5" fill="#000000"/>

  <!-- Telemetry HUD Banner: Crop Loss Reality -->
  <g transform="translate(480, 40)">
    <rect width="280" height="92" rx="12" fill="#2a0c04" fill-opacity="0.92" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="8" fill="#dc2626"/>
    <text x="22" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">!</text>
    <text x="38" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fca5a5" letter-spacing="0.5">POST-HARVEST HEAT LOSS</text>
    <text x="38" y="36" font-family="system-ui, sans-serif" font-size="9" fill="#f87171">Torpa Smallholder Vegetable Cluster</text>

    <!-- Stat 1: Spoilage -->
    <rect x="16" y="48" width="118" height="34" rx="6" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
    <text x="24" y="60" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#fdba74">HARVEST LOSS RATE</text>
    <text x="24" y="75" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ef4444">38% Lost</text>
    <text x="86" y="74" font-family="system-ui, sans-serif" font-size="7.5" fill="#fca5a5">(In 48 hrs)</text>

    <!-- Stat 2: Loss / Farmer -->
    <rect x="142" y="48" width="122" height="34" rx="6" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
    <text x="150" y="60" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#fdba74">NET INCOME DEFICIT</text>
    <text x="150" y="75" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ef4444">-₹8,400</text>
    <text x="210" y="74" font-family="system-ui, sans-serif" font-size="7.5" fill="#fca5a5">(42°C Glut)</text>
  </g>
</svg>
